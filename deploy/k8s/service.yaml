apiVersion: v1
kind: Service
metadata:
  name: zlmediakit
  namespace: zlmediakit
spec:
  # hostNetwork 下 Pod 已直接监听节点 IP:端口；
  # 本 Service 供集群内部（其他 Pod）通过 zlmediakit.zlmediakit.svc 访问。
  # 如需集群外访问，可将 type 改为 NodePort 或 LoadBalancer（见 README）。
  type: ClusterIP
  selector:
    app: zlmediakit
  ports:
    - { name: http,        port: 80,   targetPort: http,  protocol: TCP }
    - { name: https,       port: 443,  targetPort: https, protocol: TCP }
    - { name: rtmp,        port: 1935, targetPort: rtmp, protocol: TCP }
    - { name: rtsp,        port: 554,  targetPort: rtsp, protocol: TCP }
    - { name: rtp-proxy,   port: 10000, targetPort: rtp-proxy,   protocol: TCP }
    - { name: rtp-proxy-u, port: 10000, targetPort: rtp-proxy-u, protocol: UDP }
    - { name: rtc,         port: 8000, targetPort: rtc,  protocol: TCP }
    - { name: rtc-u,       port: 8000, targetPort: rtc-u, protocol: UDP }
    - { name: rtc2,        port: 9000, targetPort: rtc2, protocol: TCP }
    - { name: rtc2-u,      port: 9000, targetPort: rtc2-u, protocol: UDP }
