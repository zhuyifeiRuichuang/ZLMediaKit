apiVersion: apps/v1
kind: Deployment
metadata:
  name: zlmediakit
  namespace: zlmediakit
  labels:
    app: zlmediakit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zlmediakit
  template:
    metadata:
      labels:
        app: zlmediakit
    spec:
      # 媒体服务器需要大量 UDP 端口（RTP/RTCP 30000-35000、RTC 49152-65535），
      # 采用 hostNetwork 可直接暴露节点 IP:端口，避免逐个 NodePort 映射。
      # 多副本需每台节点一个 Pod（配合 topology spread / 节点划分）。
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: zlmediakit
          # 生产环境务必改为具体版本号（如 1.0.0），不要长期使用 latest
          image: ghcr.io/zhuyifeiRuichuang/zlmediakit:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "Asia/Shanghai"
          ports:
            - { name: http,        containerPort: 80,   protocol: TCP }
            - { name: https,       containerPort: 443,  protocol: TCP }
            - { name: rtmp,        containerPort: 1935, protocol: TCP }
            - { name: rtsp,        containerPort: 554,  protocol: TCP }
            - { name: rtp-proxy,   containerPort: 10000, protocol: TCP }
            - { name: rtp-proxy-u, containerPort: 10000, protocol: UDP }
            - { name: rtc,         containerPort: 8000, protocol: TCP }
            - { name: rtc-u,       containerPort: 8000, protocol: UDP }
            - { name: rtc2,        containerPort: 9000, protocol: TCP }
            - { name: rtc2-u,      containerPort: 9000, protocol: UDP }
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: config
              mountPath: /opt/media/conf
            - name: cert
              mountPath: /opt/media/bin/default.pem
              subPath: default.pem
      volumes:
        - name: config
          configMap:
            name: zlm-config
        - name: cert
          secret:
            name: zlm-cert
