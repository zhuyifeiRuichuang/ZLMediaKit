name: zlmediakit

services:
  zlmediakit:
    image: ${ZLM_IMAGE:-ghcr.io/zhuyifeiruichuang/zlmediakit}:${ZLM_VERSION:-latest}
    container_name: zlmediakit
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./config:/opt/media/conf
      - ./cert/default.pem:/opt/media/bin/default.pem
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
