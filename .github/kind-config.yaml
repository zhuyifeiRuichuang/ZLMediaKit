# CI 部署测试使用的 kind 单节点集群配置
# 由 zlm-deploy-test.yml 的 deploy-test-k8s job 通过 `kind create cluster --config` 引用。
#
# extraPortMappings：把 Pod 的 hostNetwork 端口映射到 runner 本机，
# 使测试可以像访问本机服务一样访问集群内服务（等效于 docker compose 的端口发布）。
# hostPort 必须与 deploy-test-k8s job 的 env PORT_HTTP / PORT_RTMP / PORT_RTSP 保持一致。
#
# 参考：https://kind.sigs.k8s.io/docs/user/configuration/
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 30080
        protocol: TCP
      - containerPort: 1935
        hostPort: 31935
        protocol: TCP
      - containerPort: 554
        hostPort: 30554
        protocol: TCP
