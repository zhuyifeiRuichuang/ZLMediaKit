name: zlm-build-images

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（需与 zlm-build-artifacts 的 Release 标签一致，不要加 v 前缀）'
        required: true
        default: '1.0.0'
      base_image:
        description: '运行时基础镜像（完整功能须用 ubuntu:24.04 以匹配编译期 SONAME）'
        required: true
        default: 'ubuntu:24.04'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event.inputs.version }}
      BASE_IMAGE: ${{ github.event.inputs.base_image }}
    steps:
      - name: Checkout（仅取构建文件，无需子模块）
        uses: actions/checkout@v4

      - name: 计算镜像名（GHCR 要求全小写）
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${OWNER_LC}/zlmediakit" >> "$GITHUB_ENV"

      - name: 从 GitHub Release 下载 mediaserver 双架构制品
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p staging
          gh release download "$VERSION" \
            --repo "${{ github.repository }}" \
            --pattern "mediaserver-linux-*-${VERSION}.tar.gz" \
            --dir staging
          for f in staging/mediaserver-linux-*.tar.gz; do
            arch="$(echo "$f" | sed -E 's#.*mediaserver-linux-([a-z0-9]+)-.*#\1#')"
            echo "==> 解包 $f -> $arch"
            mkdir -p "$arch"
            tar -xzf "$f" -C "$arch"
          done
          ls -R amd64 arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 逐架构构建并推送（从预编译制品装配）
        run: |
          for arch in amd64 arm64; do
            echo "==> 构建 linux/$arch"
            docker buildx build --platform "linux/$arch" \
              --build-arg BASE_IMAGE="$BASE_IMAGE" \
              --build-arg ARCH="$arch" \
              -f building/Dockerfile.runtime \
              --provenance=false --sbom=false \
              -t "$IMAGE:$VERSION-$arch" \
              --push .
          done

      - name: 合并多架构清单（<version> 与 latest）
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools create -t "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          echo "==> 已发布: $IMAGE:$VERSION (multi-arch) / $IMAGE:latest"
